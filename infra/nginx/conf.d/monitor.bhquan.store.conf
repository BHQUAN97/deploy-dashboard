# Deploy Dashboard — internal management UI
# SSL cert: shared_certbot_data

server {
    listen 80;
    server_name monitor.bhquan.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.bhquan.store;

    ssl_certificate     /etc/letsencrypt/live/monitor.bhquan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.bhquan.store/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSE: disable proxy buffering
    proxy_buffering off;

    location / {
        set $dashboard http://deploy-dashboard:7000;
        proxy_pass $dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE support
        proxy_read_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
