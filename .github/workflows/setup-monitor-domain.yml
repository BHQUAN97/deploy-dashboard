name: Setup monitor.bhquan.store

on:
  workflow_dispatch:

jobs:
  setup:
    name: DNS to Certbot to HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass dnsutils > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV
          echo "VPS=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" >> $GITHUB_ENV
          echo "PORT=${{ secrets.VPS_PORT }}" >> $GITHUB_ENV

      - name: Upload HTTP conf + cleanup old domain
        run: |
          sshpass -e ssh -p $PORT $VPS "
            set -e
            CONF_DIR=/opt/infra/nginx/conf.d

            # Xoa conf cu neu co
            rm -f \$CONF_DIR/deploy-dashboard.bhquan.store.conf
            echo 'Removed old deploy-dashboard conf (if existed)'

            # Ghi HTTP-only conf cho monitor.bhquan.store
            cat > \$CONF_DIR/monitor.bhquan.store.conf << ENDOFCONF
server {
    listen 80;
    server_name monitor.bhquan.store;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://monitor.bhquan.store\\\$request_uri; }
}
ENDOFCONF

            # Test + reload nginx
            docker exec shared-nginx nginx -t 2>&1 && \
            docker exec shared-nginx nginx -s reload && \
            echo 'nginx reloaded with HTTP conf for monitor.bhquan.store'
          "

      - name: Wait for DNS propagation (max 30 min)
        run: |
          VPS_IP="${{ secrets.VPS_HOST }}"
          echo "Waiting for monitor.bhquan.store -> $VPS_IP ..."
          for i in $(seq 1 30); do
            RESOLVED=$(dig +short monitor.bhquan.store @8.8.8.8 2>/dev/null | head -1)
            echo "Attempt $i/30: resolved='$RESOLVED' (want '$VPS_IP')"
            if [ "$RESOLVED" = "$VPS_IP" ]; then
              echo "DNS OK"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::DNS did not propagate after 30 minutes. Set: monitor.bhquan.store A $VPS_IP then re-run."
              exit 1
            fi
            sleep 60
          done

      - name: Run certbot
        run: |
          sshpass -e ssh -p $PORT $VPS "
            set -e
            docker exec infra-certbot certbot certonly \
              --webroot -w /var/www/certbot \
              -d monitor.bhquan.store \
              --email buihongquan28041997@gmail.com \
              --agree-tos --non-interactive --force-renewal
            echo 'Certbot OK'
          "

      - name: Upload HTTPS conf + reload nginx
        run: |
          sshpass -e scp -P $PORT \
            infra/nginx/conf.d/monitor.bhquan.store.conf \
            $VPS:/opt/infra/nginx/conf.d/monitor.bhquan.store.conf
          sshpass -e ssh -p $PORT $VPS "
            docker exec shared-nginx nginx -t 2>&1 && \
            docker exec shared-nginx nginx -s reload && \
            echo 'nginx reloaded with HTTPS conf'
          "

      - name: Remove old cert (cleanup)
        run: |
          sshpass -e ssh -p $PORT $VPS "
            docker exec infra-certbot rm -rf \
              /etc/letsencrypt/live/deploy-dashboard.bhquan.store \
              /etc/letsencrypt/archive/deploy-dashboard.bhquan.store \
              /etc/letsencrypt/renewal/deploy-dashboard.bhquan.store.conf 2>/dev/null || true
            echo 'Old cert cleanup done'
          "

      - name: Verify HTTPS
        run: |
          sleep 5
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://monitor.bhquan.store/ 2>/dev/null || echo "000")
          echo "HTTPS status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "302" ]; then
            echo "monitor.bhquan.store is UP"
          else
            echo "::warning::Got HTTP $STATUS - app may still be starting"
          fi

      - name: Summary
        run: |
          echo "========================================"
          echo "Setup complete!"
          echo "URL: https://monitor.bhquan.store"
          echo "Credentials: admin / Deploy@2026!"
          echo "========================================"
