name: VPS Diagnostics
on:
  repository_dispatch:
    types: [vps-diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV
      - name: Check VPS state
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== All nginx confs ==='
            ls /opt/infra/nginx/conf.d/
            echo ''
            echo '=== monitor.bhquan.store.conf ==='
            cat /opt/infra/nginx/conf.d/monitor.bhquan.store.conf 2>/dev/null || echo 'FILE NOT FOUND'
            echo ''
            echo '=== deploy-dashboard container ==='
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}' | grep -E 'deploy|NAME' || echo 'not found'
            echo ''
            echo '=== nginx test ==='
            docker exec shared-nginx nginx -t 2>&1 | tail -5
            echo ''
            echo '=== Test local request to deploy-dashboard ==='
            curl -sk http://deploy-dashboard:7000/api/domains/health 2>/dev/null | head -c 200 || echo 'Cannot reach deploy-dashboard:7000'
          "
